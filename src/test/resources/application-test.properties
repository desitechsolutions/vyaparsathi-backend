# ===================================================================
# Spring Boot Test Configuration (Profile: test)
# ===================================================================

# 1. Database Configuration (H2 In-Memory)
# Note: Removed MODE=MySQL to prevent the "Domain BOOLEAN DEFAULT" error
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# 2. Disable Cloud & Migrations
spring.cloud.gcp.sql.enabled=false
spring.flyway.enabled=false
# Prevents GCP Storage from looking for credentials
spring.autoconfigure.exclude=com.google.cloud.spring.autoconfigure.storage.GcpStorageAutoConfiguration

# 3. Security & JWT
# Ensure this matches the length requirements for your JJWT version
jwt.secret=Ym9yZWRvbS1pcy1hLWZpbmUtdGhpbmctZm9yLWEtc2VjcmV0LWtleS1leGFtcGxlCg==
jwt.expiration=3600000
jwt.refreshExpiration=604800000
jwt.invoice.expiration=1800000

# 4. Email Configuration (Mock/Dummy)
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@vyaparsathi.com
spring.mail.password=testpassword
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# 5. Application Specific Properties
app.frontend-url=http://localhost:4200
app.reset-password-url=http://localhost:4200/reset-password
app.reset-token-expiration=3600000

# 6. Additional placeholders (Commonly required in Auth/Service layers)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE