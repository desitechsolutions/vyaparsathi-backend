spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

jwt.secret=${JWT_SECRET}
spring.jpa.show-sql=false

# Mail From Secrets
spring.mail.host=smtp.zoho.in
spring.mail.port=465
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.zoho.in
app.mail.display-name=VyaparSathi Support
# Timeouts
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Kafka Cloud
#spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

# -- Password reset config
app.reset-token-expiration=1800000
app.frontend-url=${APP_FRONTEND_URL:${APP_ALLOWED_ORIGINS}}
app.reset-password-url=${app.frontend-url}/auth/reset-password
app.verify-email-url=${app.frontend-url}/auth/verify-email
app.accept-shop-invite-url=${app.frontend-url}/accept-shop-invite
app.allowed-origins=${APP_ALLOWED_ORIGINS}

# -- Email verification gate
# In production, unverified accounts are blocked at login. Override via env.
auth.require-email-verified=${AUTH_REQUIRE_EMAIL_VERIFIED:true}

#cloud bucket
spring.file.upload.dir=gs://vyaparsathi_s3_bucket/

# Auth Cookie — production HTTPS (cross-origin)
# SameSite=None is required when backend and frontend are on different origins.
# Secure=true is mandatory alongside SameSite=None.
app.auth.cookie.secure=true
app.auth.cookie.same-site=None
app.auth.cookie.path=/

# OAuth2 — credentials injected via environment variables in production
app.oauth2.frontend-redirect-uri=${APP_OAUTH2_FRONTEND_REDIRECT_URI:https://app.vyaparsathi.com/auth/oauth2/callback}
app.oauth2.frontend-login-uri=${APP_OAUTH2_FRONTEND_LOGIN_URI:https://app.vyaparsathi.com/login}
