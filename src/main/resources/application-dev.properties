spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

jwt.secret=${JWT_SECRET}
spring.jpa.show-sql=false

# Mail From Secrets
spring.mail.host=smtp.zoho.in
spring.mail.port=465
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.zoho.in
app.mail.display-name=VyaparSathi Support
# Timeouts
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Kafka Cloud
#spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

# -- Password reset config
app.reset-token-expiration=1800000
# APP_FRONTEND_URL is the single base URL used in email links.
# It must be a single origin, not a comma-separated list.
# Defaults to APP_ALLOWED_ORIGINS for backwards-compat with existing .env files.
app.frontend-url=${APP_FRONTEND_URL:${APP_ALLOWED_ORIGINS}}
app.reset-password-url=${app.frontend-url}/auth/reset-password
app.verify-email-url=${app.frontend-url}/auth/verify-email
app.accept-shop-invite-url=${app.frontend-url}/accept-shop-invite
app.allowed-origins=${APP_ALLOWED_ORIGINS}

# -- Email verification gate
# Set to true once SMTP delivery is verified in this environment. When true,
# unverified users are blocked at login.
auth.require-email-verified=false

# Auth Cookie — dev HTTP override (same as local)
app.auth.cookie.secure=false
app.auth.cookie.same-site=Lax
app.auth.cookie.path=/
