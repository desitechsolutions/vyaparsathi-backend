spring.application.name=vyaparsathi
server.port=${PORT:8080}

#logging.file.name=logs/vyaparsathi.log

# JWT Common Defaults
# Phase 1 tightens access-token TTL to 15 minutes; refresh token stays 7 days.
# A stolen access token now lives 15 min tops; the refresh flow silently
# re-issues one before expiry (see AuthContext.silentRefresh on the FE).
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refreshExpiration=604800000
jwt.invoice.expiration=1800000

# Auth Cookie Configuration
# Base defaults are dev-safe (HTTP, same-origin).
# application-prod.properties overrides to secure=true, same-site=None for HTTPS cross-origin.
# Path stays "/" in all profiles to avoid orphan cookies from path mismatches.
app.auth.cookie.secure=false
app.auth.cookie.same-site=Lax
app.auth.cookie.path=/

# JPA Common
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.filters=shopFilter

# Flyway Common
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.out-of-order=true

# File Upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB

# =============================================================================
# E-Invoicing (NIC IRP)
# Default provider is MOCK — no network calls, fake IRN generated in-process.
# Set einvoice.provider=NIC in prod to hit the real NIC portal. When NIC is
# selected, credentials MUST be supplied via environment variables — never
# check them into source control.
# =============================================================================
einvoice.provider=${EINVOICE_PROVIDER:MOCK}
einvoice.nic.base-url=${EINVOICE_NIC_BASE_URL:https://einv-apisandbox.nic.in}
einvoice.nic.client-id=${EINVOICE_NIC_CLIENT_ID:}
einvoice.nic.client-secret=${EINVOICE_NIC_CLIENT_SECRET:}
einvoice.nic.username=${EINVOICE_NIC_USERNAME:}
einvoice.nic.password=${EINVOICE_NIC_PASSWORD:}
einvoice.nic.sandbox=${EINVOICE_NIC_SANDBOX:true}
einvoice.nic.timeout-ms=${EINVOICE_NIC_TIMEOUT_MS:10000}

# =============================================================================
# Razorpay AutoPay Subscription Configuration
# All secret values MUST be provided via environment variables.
# Never hard-code credentials here — see .env.example for the required vars.
# The previously committed test keys must be considered leaked and rotated in
# the Razorpay dashboard before this file is shipped.
# =============================================================================
subscription.provider=${SUBSCRIPTION_PROVIDER:RAZORPAY}
subscription.razorpay.key-id=${RAZORPAY_KEY_ID:}
subscription.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
subscription.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
subscription.razorpay.currency=INR

# =============================================================================
# Async Processing Configuration
# Enables @Async methods for offline sales processing and background tasks
# =============================================================================
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=offline-sales-

# =============================================================================
# Offline Sales Queue Configuration
# =============================================================================
# Maximum times a FAILED record is retried before it stops being picked up.
offline.queue.max-retries=5
# Minutes a record may sit in PROCESSING before being reset to FAILED on startup.
offline.queue.stale-minutes=10
# Days to retain COMPLETED queue records before nightly cleanup removes them.
offline.sales.retention-days=7

# =============================================================================
# OAuth2 Social Login (Google + Microsoft)
# =============================================================================
# Frontend URL that the browser is redirected to after a successful OAuth2 login.
app.oauth2.frontend-redirect-uri=${APP_OAUTH2_FRONTEND_REDIRECT_URI:http://localhost:3000/auth/oauth2/callback}
# Frontend login URL used when OAuth2 authentication fails.
app.oauth2.frontend-login-uri=${APP_OAUTH2_FRONTEND_LOGIN_URI:http://localhost:3000/login}

# OAuth2 provider registrations (Google, Microsoft) are configured per-profile only.
# Do NOT add spring.security.oauth2.client.registration.* entries here with empty
# client-id/client-secret defaults — Spring Boot validates all defined registrations
# at startup and will fail with "Client id must not be empty" if any resolve to "".
# Add full registrations (client-id + client-secret + scope + redirect-uri) in:
#   application-local.properties   → your local Google credentials
#   application-dev.properties     → dev/staging credentials
#   application-production.properties / env vars → production credentials
