spring.application.name=vyaparsathi
server.port=${PORT:8080}

#logging.file.name=logs/vyaparsathi.log

# JWT Common Defaults
jwt.expiration=${JWT_EXPIRATION:36000000}
jwt.refreshExpiration=604800000
jwt.invoice.expiration=1800000

# JPA Common
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.filters=shopFilter

# Flyway Common
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# File Upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB

# =============================================================================
# Razorpay AutoPay Subscription Configuration
# All secret values MUST be provided via environment variables.
# Never hard-code credentials here.
# =============================================================================
subscription.provider=${SUBSCRIPTION_PROVIDER:RAZORPAY}
subscription.razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_TGq0HbXip2bkeQ}
subscription.razorpay.key-secret=${RAZORPAY_KEY_SECRET:97EIzL05uSy3UVkjogEhFoFt}
subscription.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:Biruma@Webhook#2026!Subscription}
subscription.razorpay.currency=INR
