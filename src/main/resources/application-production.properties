# ============================================
# Production Configuration for VyaparSathi Payroll
# ============================================

# Server
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=${KEYSTORE_PATH}
server.ssl.key-store-password=${KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12

# Database - RDS Connection
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:/db/migration
spring.flyway.baseline-on-migrate=true

# Security
spring.security.require-https=true
spring.security.filter.dispatcher-types=REQUEST,FORWARD,INCLUDE,ERROR
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration=3600000

# CORS
cors.allowed.origins=${CORS_ORIGINS}
cors.allowed.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
cors.allowed.headers=*
cors.max.age=3600

# Rate Limiting
rate.limit.enabled=true
rate.limit.requests-per-minute=1000
rate.limit.burst-size=100

# Logging
logging.level.root=WARN
logging.level.com.desitech.vyaparsathi=INFO
logging.level.com.desitech.vyaparsathi.payroll=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=/var/log/vyaparsathi/payroll.log
logging.file.max-size=10MB
logging.file.max-history=30

# Audit
audit.enabled=true
audit.store=database
audit.retention-days=365

# Banking Integration
razorpay.api.key=${RAZORPAY_API_KEY}
razorpay.api.secret=${RAZORPAY_API_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}

# Email Configuration
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# WhatsApp Integration
whatsapp.api.url=${WHATSAPP_API_URL}
whatsapp.api.token=${WHATSAPP_API_TOKEN}
whatsapp.business.account.id=${WHATSAPP_BUSINESS_ACCOUNT_ID}

# Payroll Configuration
payroll.working.days.default=26
payroll.max.advance.percentage=50
payroll.esi.wage.limit=21000
payroll.pf.contribution.percentage=12
payroll.esi.employee.percentage=0.75
payroll.esi.employer.percentage=3.25

# Retry Configuration
retry.max.attempts=3
retry.initial.delay=2000
retry.multiplier=2.0
retry.max.delay=30000

# Performance
spring.threads.virtual.enabled=true
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true

# Actuator
management.server.port=9090
management.server.ssl.enabled=false

# Cache
spring.cache.type=redis
spring.redis.host=${REDIS_HOST}
spring.redis.port=${REDIS_PORT}
spring.redis.password=${REDIS_PASSWORD}
spring.redis.timeout=60000ms

# Backup
backup.enabled=true
backup.schedule=0 2 * * *
backup.retention.days=30
backup.location=s3://vyaparsathi-backups
